name: Release APKs

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"
          [ "$want" = "$have" ] || { echo "tag $want != pubspec $have"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi

      - name: Checksums
        working-directory: build/app/outputs/flutter-apk
        run: |
          for f in app-*-release.apk; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/flutter-apk
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --generate-notes app-*-release.apk app-*-release.apk.sha256

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: apks
          path: build/app/outputs/flutter-apk/app-*-release.apk*
